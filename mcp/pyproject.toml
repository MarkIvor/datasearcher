[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasearcher-mcp"
version = "1.0.0"
description = "MCP-сервер DataSearcher: аналитика данных и БД через DuckDB с 29 инструментами анализа."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DataSearcher" }]
keywords = ["mcp", "duckdb", "analytics", "data", "sql", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp[cli]>=1.28,<2",
    "duckdb>=1.0.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "rapidfuzz>=3.9.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pandas>=2.0.0",
    "sqlglot>=23.0.0",
    "starlette>=0.30.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.1.0"]
clickhouse = ["clickhouse-connect>=0.7.0"]
all = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "clickhouse-connect>=0.7.0",
]

[project.scripts]
datasearcher-mcp = "datasearcher_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datasearcher_mcp = ["py.typed"]
