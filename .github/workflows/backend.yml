name: Backend Tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test suite
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-0123456789abcdef
          ENCRYPTION_KEY: ""
          RATE_LIMIT_ENABLED: "false"
          LOG_ENABLED: "true"
          PII_MASKING: "true"
          READ_ONLY: "true"
        run: python -m pytest tests/ -v --junitxml=test-results.xml

      - name: Test summary
        if: always()
        working-directory: backend
        run: |
          echo "## Backend tests" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("test-results.xml").getroot()
              total = root.attrib.get("tests", "?")
              failed = root.attrib.get("failures", "0") + root.attrib.get("errors", "0")
              print(f"**{total} tests** — failures/errors: {failed}" + (" — ✅ all green" if failed in ("0", "00") else ""))
          except Exception as e:
              print("summary parse error:", e)
          EOF
          cat test-results.xml >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
