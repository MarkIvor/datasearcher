services:
  # ── DataSearcher Backend ───────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - UPLOAD_DIR=/app/uploads
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:14b}
      - KB_DB_PATH=/app/data/datasearcher_kb.db
      - LOG_DB_PATH=/app/data/datasearcher_logs.db
      - EMBEDDINGS_DIR=/app/data/embeddings
      - EXPORTS_DIR=/app/data/exports
    volumes:
      - upload_data:/app/uploads
      - app_data:/app/data
      - ./demo-data:/app/demo-data:ro
    mem_limit: 4g
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ── DataSearcher Frontend ──────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ── DataSearcher MCP (profile: mcp) ────────
  # Запуск: docker compose --profile mcp up -d mcp
  mcp:
    build: ./mcp
    profiles: ["mcp"]
    ports:
      - "8100:8000"
    volumes:
      # Монтируйте свой connections.yaml:
      - ./mcp/connections.yaml:/app/connections.yaml:ro
      # Персистентность артефактов (графики, экспорты, дашборды):
      - mcp_exports:/app/exports
      - mcp_charts:/app/charts
      - mcp_dashboards:/app/dashboards
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_MODE=${LLM_MODE:-builtin}
      - DATASEARCHER_MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - DATASEARCHER_MCP_QUERY_TIMEOUT=60
    restart: unless-stopped

  # ── PostgreSQL: e-commerce demo ────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: datasearcher
      POSTGRES_PASSWORD: ds_demo_pass_2024
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./demo-data/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasearcher -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MySQL: CRM demo ────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2024
      MYSQL_DATABASE: crm
      MYSQL_USER: datasearcher
      MYSQL_PASSWORD: ds_demo_pass_2024
    volumes:
      - mysql_data:/var/lib/mysql
      - ./demo-data/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_pass_2024 --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ── ClickHouse: web analytics demo ─────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: datasearcher
      CLICKHOUSE_PASSWORD: ds_demo_pass_2024
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./demo-data/init-clickhouse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- 'http://127.0.0.1:8123/ping' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

volumes:
  upload_data:
  app_data:
  postgres_data:
  mysql_data:
  clickhouse_data:
  mcp_exports:
  mcp_charts:
  mcp_dashboards: